<!DOCTYPE html>
<html>
<head>
<title>College Event Portal</title>
<style>
body { font-family: Arial; margin: 0; background: #eee; }
header { background: navy; color: white; padding: 15px; display: flex; justify-content: space-between; }
nav { display: flex; gap: 15px; }
nav a { color: white; text-decoration: none; }
h2 { text-align: center; }
.events { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; padding: 20px; }
.card { background: white; padding: 20px; text-align: center; border-radius: 8px; }
button { background: navy; color: white; padding: 8px; border: none; }
footer { background: navy; color: white; text-align: center; padding: 10px; }
</style>
</head>
<body>
<header><h3>College Events</h3><nav><a href="#">Home</a><a href="#events">Events</a></nav></header>
<h2>Upcoming Events</h2>
<div class="events" id="events">
<div class="card"><h3>Tech Fest</h3><p>25 October</p><button onclick="alert('Registered!')">Register</button></div>
<div class="card"><h3>Cultural Fest</h3><p>28 October</p><button onclick="alert('Registered!')">Register</button></div>
<div class="card"><h3>Sports Meet</h3><p>30 October</p><button onclick="alert('Registered!')">Register</button></div>
</div>
<footer>College Event Portal © 2026</footer>
</body>
</html>
